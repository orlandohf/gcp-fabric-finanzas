name: Diagramas de arquitectura

# Diagrams as code: al cambiar docs/diagramas/*.py en una rama, se regeneran los PNG y se commitean en esa rama.
on:
  push:
    branches-ignore: [main]
    paths:
      - "docs/diagramas/**.py"
      - ".github/workflows/diagramas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Graphviz y diagrams
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz fonts-dejavu-core >/dev/null
          pip install --quiet "diagrams==0.24.4"

      - name: Generar PNG
        working-directory: docs/diagramas
        run: |
          python generar.py
          ls -la *.png

      - name: Commitear los PNG si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagramas/*.png
          if git diff --cached --quiet; then echo "Sin cambios en los diagramas"; exit 0; fi
          git commit -m "Diagramas: regenerar PNG desde generar.py"
          git push
